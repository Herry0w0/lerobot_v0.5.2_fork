# ============================================================================
# 翻包项目 PI05 + Delta Action + 3 摄像头训练配置（rigid_LW_plane 专用）
# ============================================================================
# 针对 /mnt/data3/jiangxirui/rigid_LW_plane（134 eps / 91,536 帧，2 任务）调整：
#   1. dataset.root → /mnt/data3/jiangxirui/rigid_LW_plane，显式设置 repo_id /
#      return_uint8 / use_imagenet_stats=false
#   2. 开启 Letterbox 安全版光度增强（brightness/saturation/hue/sharpness；
#      禁用会破坏 28px 黑边同构的 contrast 与 affine）
#   3. 配合全局分位数重算与 state_np clip，保持 STATE: QUANTILES 且杜绝越界 "-1" token
#   4. 启用 state_dropout_prob: 0.1，抑制固定初始位姿下的开环背轨迹，增强视觉闭环泛化
#   5. 有效 batch = 16 × 3 GPU × 2 grad_accum = 96（YAML 与脚本同步），steps=20000
#      （≈ 21.0 epoch），save_freq=5000（共 4 个 ckpt）
#   6. action_error_metrics.every_n_steps=200，减少低收益高频 10 步去噪评估开销
# ============================================================================

# ---------------------------------------------------------------------------
# 数据集
# ---------------------------------------------------------------------------
dataset:
  repo_id: local/rigid_LW_plane
  root: /mnt/data3/jiangxirui/rigid_LW_plane
  episodes: null
  use_imagenet_stats: false
  return_uint8: true
  image_transforms:
    enable: true
    max_num_transforms: 2
    random_order: false
    tfs:
      brightness:
        type: ColorJitter
        weight: 1.0
        kwargs:
          brightness: [0.85, 1.15]
      saturation:
        type: ColorJitter
        weight: 1.0
        kwargs:
          saturation: [0.8, 1.2]
      hue:
        type: ColorJitter
        weight: 1.0
        kwargs:
          hue: [-0.03, 0.03]
      sharpness:
        type: SharpnessJitter
        weight: 0.5
        kwargs:
          sharpness: [0.7, 1.3]

# ---------------------------------------------------------------------------
# 策略模型（PI05 + Delta Action + 3 摄像头）
# ---------------------------------------------------------------------------
policy:
  type: pi05

  # ---- 模型架构 ----
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16
  image_resolution: [224, 224]

  # ---- 显式 input_features：state(16 维) + 3 相机 ----
  input_features:
    observation.state:
      type: STATE
      shape: [16]           # ← 双臂 16 维（7+1+7+1）
    observation.images.head_right:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_arm:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_arm:
      type: VISUAL
      shape: [3, 224, 224]

  output_features: {}       # 运行时自动推断为 action(16)

  # ---- 观测 / 动作 ----
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 50
  max_state_dim: 32         # 16 维会 pad 到 32
  max_action_dim: 32

  # ---- 归一化 ----
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES        # 已重算全局 91,536 帧分位数并在 processor 中做 [-1,1] clip
    ACTION: QUANTILES       # stats 来自 chunk_size=50 相对动作统计（已修正 left_gripper q01/q99）

  # ---- 相对动作（Delta 模式核心）----
  use_relative_actions: true
  relative_exclude_joints: ["gripper"]   # 双臂 gripper 保持绝对值

  # ---- 训练期泛化正则 ----
  state_dropout_prob: 0.1   # 训练时 10% 概率丢弃 state tokens，强制依赖视觉闭环
  right_arm_image_dropout:
    enabled: false
    probability: 0.2

  # ---- Flow Matching ----
  num_inference_steps: 10
  time_sampling_beta_alpha: 1.5
  time_sampling_beta_beta: 1.0
  time_sampling_scale: 0.999
  time_sampling_offset: 0.001
  min_period: 0.004
  max_period: 4.0

  # ---- 编译优化 ----
  compile_model: false      # 跑通后可改 true 提吞吐（max-autotune 首编译约 20min+）
  compile_mode: max-autotune

  # ---- 冻结策略 ----
  freeze_vision_encoder: false
  train_expert_only: false

  # ---- 优化器 ----
  optimizer_lr: 2.5e-5
  optimizer_betas: [0.9, 0.95]
  optimizer_eps: 1.0e-8
  optimizer_weight_decay: 0.01
  optimizer_grad_clip_norm: 1.0

  # ---- 学习率调度（对齐 20000 步全程）----
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 20000
  scheduler_decay_lr: 2.5e-6

  # ---- 设备 / 精度 ----
  device: cuda
  use_amp: false
  use_peft: false
  gradient_checkpointing: true

  # ---- 预训练权重（微调起点，勿置 null）----
  # 指向补丁版 base：大文件软链到 /mnt/data1 原件，仅 policy_preprocessor.json
  # 是修正过 tokenizer 路径的副本（原版记录了 zhangyuqi 机器上的 /home 路径，本机不存在）
  pretrained_path: /mnt/data3/pi05_base
  push_to_hub: false

# ---------------------------------------------------------------------------
# 输出与任务
# ---------------------------------------------------------------------------
# checkpoint 输出到 /mnt/data3/jiangxirui（启动脚本会用带时间戳的目录覆盖此默认值）
output_dir: /mnt/data3/jiangxirui/train_outputs/rigid_lw_plane_delta_3cam
job_name: pi05_3cam_rigid_lw_plane_delta

# ---------------------------------------------------------------------------
# 训练通用参数
# ---------------------------------------------------------------------------
seed: 42
resume: false
cudnn_deterministic: false

batch_size: 16              # 有效 batch = 16 × 3 GPU × 2 累积 = 96
gradient_accumulation_steps: 2
num_workers: 8
prefetch_factor: 8
persistent_workers: true

steps: 20000                # ≈ 21.0 epoch（91,536 帧 ÷ 有效 batch 96 ≈ 953.5 步/epoch）
log_freq: 50
eval_freq: 2000             # 到点跑离线动作回放（见 action_error_metrics）
save_freq: 5000             # 4 个 × ~23GB ≈ 92GB，节省磁盘空间同时覆盖 5.2~21.0 epoch
save_checkpoint: true

use_policy_training_preset: true

# ---------------------------------------------------------------------------
# 动作回放误差（fork 特有，开启后 SwanLab eval/replay 命名空间可看逐关节 MAE/MSE 与热力图）
# ---------------------------------------------------------------------------
action_error_metrics:
  enabled: true
  every_n_steps: 200        # 降低高频去噪评估开销
  heatmap_every_n_reports: 5
  save_heatmap: true

# ---------------------------------------------------------------------------
# SwanLab
# ---------------------------------------------------------------------------
wandb:
  enable: true
  backend: swanlab
  project: lerobot-pi05-package-flip
  mode: online
